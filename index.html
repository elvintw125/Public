<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>星塵守衛・網頁射擊遊戲</title>
<meta name="description" content="星塵守衛：可在瀏覽器遊玩的射擊遊戲，100 個關卡、15 把武器、28 種技能、每日獎勵與幸運轉盤。">
<meta property="og:title" content="星塵守衛">
<meta property="og:description" content="100 個關卡、15 把武器、28 種技能的網頁射擊遊戲。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%80%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#0e1026;--ink:#f1ecdf;--teal:#38e0c8;--pink:#ff4f8b;--gold:#ffc83d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
#wrap{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;width:min(100vw,66.6667vh);height:100%}
canvas{touch-action:none}
canvas{width:100%;height:100%;display:block;background:#0b0d20;cursor:crosshair}
#ui{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(11,13,32,.82);padding:24px}
#ui.hide{display:none}
#sel{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:22em;margin-top:8px}
#sel button{margin:0;font-size:14px;padding:6px 12px;background:#2a2e55;min-width:40px}
#sel button:disabled{opacity:.35;cursor:default}
#pick,#shop,#settle{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(11,13,32,.92);padding:20px;overflow:auto}
#pick.hide,#shop.hide,#settle.hide{display:none}
.stars{font-size:40px;color:var(--gold);letter-spacing:6px;margin:4px 0}
.mini{margin:0!important;padding:8px 14px!important;font-size:14px!important;background:#2a2e55!important}
.jump{margin:0;padding:4px 10px;font-size:12px;background:#2a2e55}
.evb{width:min(400px,94%);margin:10px auto 0;padding:8px 10px;border-radius:8px;background:linear-gradient(90deg,#3a1f5e,#5e1f3f);color:var(--gold);font-size:13px;cursor:pointer;box-sizing:border-box}
h2{margin:0 0 10px;color:var(--teal)}
.card{display:block;width:min(320px,86%);margin:6px 0;padding:10px 14px;text-align:left;background:#1b1f45;border:2px solid #38406f;border-radius:8px;color:var(--ink);font-size:15px;font-weight:400}
.card:hover{border-color:var(--teal)}
.card b{display:block;font-size:17px;color:var(--gold)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;width:min(400px,94%);padding:8px 10px;margin:4px 0;background:#1b1f45;border-radius:8px;text-align:left;font-size:13px;line-height:1.5}
.row.eq{border:2px solid var(--teal)}
.row b{color:var(--gold);font-size:15px}
.row button{margin:0;font-size:13px;padding:6px 10px;white-space:nowrap}
.row button:disabled{opacity:.4;cursor:default}
#hub{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;background:linear-gradient(#0e1026,#0b0d20);z-index:5}
#hub.hide{display:none}
#hh{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:12px 16px;font-weight:700;color:var(--gold)}
#hc{flex:1;overflow:auto;padding:4px 12px 16px;text-align:center;touch-action:pan-y}
#nav{display:flex;border-top:2px solid #26305f;background:#10143a;padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{flex:1;margin:0;border-radius:0;background:transparent;color:#9aa5c9;font-size:14px;padding:14px 2px}
#nav button.on{color:var(--teal);box-shadow:inset 0 3px 0 var(--teal)}
#hub button:disabled{opacity:.4;cursor:default}
.arr{width:48px;height:48px;border-radius:50%;margin:0!important;padding:0!important;font-size:18px!important;background:#2a2e55!important}
.slot{flex:1;min-height:50px;border:2px dashed #38406f;border-radius:8px;font-size:13px;display:flex;align-items:center;justify-content:center;padding:4px;color:#6b749c}
.slot.f{border-style:solid;border-color:var(--teal);color:var(--gold);cursor:pointer}
#auth{position:absolute;top:0;right:0;bottom:0;left:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#12153a;padding:20px;text-align:center;overflow:auto}
#auth.hide{display:none}
#auth input{width:min(280px,80%);padding:12px;margin:6px 0;border-radius:6px;border:2px solid #38406f;background:#0b0d20;color:var(--ink);font:inherit;font-size:16px}
#auth input:focus-visible{outline:3px solid var(--gold)}
#aerr{color:#ff8a8a;min-height:1.5em;font-size:14px}
.tabs{display:flex;gap:8px;margin:10px 0}
.tabs button{margin:0;padding:8px 22px;font-size:15px;background:#2a2e55}
.tabs button.on{background:var(--pink)}
h1{font-size:clamp(34px,9vw,52px);margin:0 0 6px;letter-spacing:.12em;color:var(--teal)}
p{margin:6px 0;line-height:1.7;max-width:20em;font-size:15px}
#best{color:var(--gold)}
button{margin-top:18px;font:inherit;font-size:18px;font-weight:700;padding:12px 36px;border:0;border-radius:6px;background:var(--pink);color:#fff;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#lobby{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch}
#lobby.hide{display:none}
#lobby .lh{text-align:center;padding:44px 16px 12px}
#lobby .lh h1{margin:0;letter-spacing:.1em}
#lobby .lh p{margin:10px auto 0;color:#9aa5c9;font-size:15px;max-width:none}
#lobby .lm{max-width:980px;margin:0 auto;padding:20px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
#lobby .lc{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:12px;background:#1b1f45;border:2px solid #38406f;color:inherit;text-decoration:none}
#lobby a.lc:hover,#lobby a.lc:focus-visible{border-color:var(--teal)}
#lobby a.lc:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#lobby .lc.soon{opacity:.55;border-style:dashed}
#lobby .ico{font-size:44px;line-height:1}
#lobby .lc h2{margin:0;font-size:22px;color:var(--ink)}
#lobby .d{margin:0;color:#9aa5c9;font-size:14px;line-height:1.7;flex:1;max-width:none}
#lobby .tags{display:flex;gap:6px;flex-wrap:wrap}
#lobby .tags span{font-size:12px;padding:2px 8px;border-radius:99px;background:#10143a;color:#9aa5c9}
#lobby .info{font-size:13px;color:var(--gold);min-height:1.2em}
#lobby .go{align-self:flex-start;padding:8px 22px;border-radius:6px;background:var(--pink);color:#fff;font-weight:700;font-size:15px}
#lobby .soon .go{background:#2a2e55;color:#9aa5c9}
#lobby .lf{text-align:center;color:#9aa5c9;font-size:12px;padding:0 16px 30px}
#lobby .sec{max-width:980px;margin:6px auto 0;padding:0 16px;color:#9aa5c9;font-size:14px;font-weight:700;letter-spacing:.1em}
#mg{position:fixed;top:0;right:0;bottom:0;left:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}
#mg.hide{display:none}
#mg .mgh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));font-weight:700;color:var(--gold)}
#mg .mgh button{margin:0;padding:6px 12px;font-size:14px;background:#2a2e55}
#mg .mgc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:auto;padding:10px}
#mg .mgo{position:fixed;top:0;right:0;bottom:0;left:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(11,13,32,.88);text-align:center;padding:20px}
#mg .mgo h2{margin:0 0 12px}
#mg .mgc button{margin:0}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="480" height="720"></canvas>
<div id="ui">
<h1 id="t">星塵守衛</h1>
<p id="m">移動滑鼠或手指拖曳來操控飛船，飛船會自動射擊。<br>鍵盤：方向鍵或 WASD，P 暫停。</p>
<p>金色方塊升級火力，青色圓環補一層護盾。</p>
<p id="best"></p><p style="font-size:13px;opacity:.8">已解鎖的關卡，點數字可直接進入</p><div id="sel"></div>
<button id="go">開始遊戲</button>
</div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d',{willReadFrequently:true}),W=480,H=720;
const ui=document.getElementById('ui'),go=document.getElementById('go');
const C={teal:'#38e0c8',pink:'#ff4f8b',gold:'#ffc83d',ink:'#f1ecdf'};
let best=0;
function showBest(){document.getElementById('best').textContent=best?'最高分：'+best:''}showBest();

let lobbyEl=null,miniOpen=false;function lobbyOn(){return !!lobbyEl&&(!lobbyEl.classList.contains('hide')||miniOpen)}
let ac=null,AU={s:1,m:1},bgmName='',bgmT=0,bgmStep=0,bgmTimer=0,mgain=null;
try{const a=JSON.parse(localStorage.getItem('stardust-audio')||'null');if(a)AU=a}catch(e){}
function actx(){try{if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();mgain=ac.createGain();mgain.gain.value=1;mgain.connect(ac.destination)}if(ac.state==='suspended')ac.resume();return ac}catch(e){return null}}
function tone(f,d,type,v,t0){const c=actx();if(!c)return;const t=t0||c.currentTime,o=c.createOscillator(),g=c.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(mgain);o.start(t);o.stop(t+d+.02)}
function noise(d,v,fc,t0){const c=actx();if(!c)return;const n=Math.floor(c.sampleRate*d),b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=c.createBufferSource(),g=c.createGain(),f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=fc||1500;s.buffer=b;g.gain.value=v;s.connect(f);f.connect(g);g.connect(mgain);s.start(t0||c.currentTime)}
function beep(f,d,type,v){if(!AU.s)return;tone(f,d,type,v||.03)}
function sfx(n){if(!AU.s)return;const c=actx();if(!c)return;const t=c.currentTime;
  if(n==='boom')noise(.3,.1,900);
  else if(n==='clear'){[523,659,784,1047].forEach((f,i)=>tone(f,.28,'triangle',.07,t+i*.12))}
  else if(n==='over'){[392,330,262,196].forEach((f,i)=>tone(f,.32,'sawtooth',.05,t+i*.18))}
  else if(n==='coin'){tone(1319,.08,'square',.04,t);tone(1760,.12,'square',.04,t+.07)}
  else if(n==='boss'){[110,110,147].forEach((f,i)=>tone(f,.4,'sawtooth',.07,t+i*.25))}
  else if(n==='spin')tone(700+Math.random()*300,.04,'square',.03)}
const TRK={menu:{bpm:84,bass:[0,0,5,3],lead:[7,10,12,10,7,5,3,5],w:'triangle',v:.04},play:{bpm:132,bass:[0,0,3,5,0,0,7,5],lead:[12,10,12,15,12,10,8,10],w:'square',v:.026},boss:{bpm:156,bass:[0,0,0,1,0,0,3,1],lead:[12,13,12,10,12,13,15,13],w:'sawtooth',v:.028}};
function mf(x){return 110*Math.pow(2,x/12)}
function bgm(n){bgmName=n;bgmStep=0;if(ac)bgmT=ac.currentTime+.05;if(!bgmTimer)bgmTimer=setInterval(bgmTick,100)}
function bgmTick(){const c=ac;if(!c||c.state!=='running'||!AU.m||!bgmName||lobbyOn())return;const T=TRK[bgmName],st=60/T.bpm/2;if(bgmT<c.currentTime-.5)bgmT=c.currentTime+.05;
  while(bgmT<c.currentTime+.35){const i=bgmStep%16,t=bgmT;
    if(i%2===0)tone(mf(T.bass[(i>>1)%T.bass.length]-12),st*1.8,'triangle',T.v*1.6,t);
    if(bgmName==='menu'?i%4===0:true)tone(mf(T.lead[i%T.lead.length]),st*.9,T.w,T.v,t);
    if(bgmName!=='menu'&&i%2===1)noise(.05,.02,6000,t);
    bgmStep++;bgmT+=st}}
function saveAU(){try{localStorage.setItem('stardust-audio',JSON.stringify(AU))}catch(e){}}
let gest=false;function g1(){if(gest)return;gest=true;actx();if(!lobbyOn())bgm(bgmName||'menu')}
addEventListener('pointerdown',g1);addEventListener('keydown',g1);

let S='menu',P,bul,ebul,en,fx,pu,score,time,spawnT,paused=false;
const stars=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,z:Math.random()*2+.5}));
const keys={};let tx=W/2,ty=H-110,usePtr=false;
const NAMES=['星塵初開','蛇行群','重型來襲','隕石帶','雙子風暴','彈幕走廊','鋼鐵艦隊','暗物質','星門守衛','終焉之王'];
const LV=Array.from({length:100},(_,i)=>({n:NAMES[Math.floor(i/10)]+' '+(i%10+1),dur:Math.round(22+i*.35+((i*7)%5)*4),rate:Math.max(.28,.9-i*.012),spd:Math.min(2.4,1+i*.015),m1:Math.min(.6,.1+i*.02),m2:i>=1?Math.min(.4,i*.02):0,bhp:80+i*45}));
let lvl=0,lt=0,phase='fight',banner=0,ct=0,startLvl=0,maxLvl=0;
let picking=false,lk=0,K={dmg:0,rate:0,coin:0,pierce:0,crit:0};
const MAXL=5;
const WP=[
{n:'脈衝砲',k:'pulse',d:1,n2:1,r:.17,sp:.1,j:0,w:2,x:1,t:'均衡的基本武器'},
{n:'連發機槍',k:'mg',d:.7,n2:2,r:.08,sp:.08,j:.12,w:2,x:1,t:'超高射速'},
{n:'散彈槍',k:'sg',d:1,n2:5,r:.5,sp:.7,j:.1,w:2,x:2,t:'扇形多發，近距離強'},
{n:'穿透雷射',k:'laser',d:3.5,n2:1,r:.3,sp:.12,j:0,w:6,x:1,t:'高傷害，可貫穿敵人'},
{n:'爆裂火箭',k:'rocket',d:8,n2:1,r:.65,sp:.2,j:0,w:5,x:1,t:'命中時範圍爆炸'}];
WP.push(
{n:'追蹤飛彈',k:'homing',d:2.2,n2:2,r:.5,sp:.5,j:.2,w:4,x:1,t:'自動追蹤最近的敵人'},
{n:'電弧鏈',k:'chain',d:4,n2:1,r:.4,sp:.1,j:0,w:4,x:1,t:'命中後電擊鄰近 2 個敵人'},
{n:'重型加農砲',k:'cannon',d:14,n2:1,r:1,sp:.1,j:0,w:10,x:1,t:'超高單發傷害，穿透 2 隻'},
{n:'電漿三連射',k:'plasma',d:1.3,n2:3,r:.15,sp:.3,j:.05,w:3,x:2,t:'高傷害三連發，最強火力'});
WP.push(
{n:'炎爆槍',k:'burn',d:1.2,n2:2,r:.22,sp:.15,j:.1,w:4,x:1,t:'點燃敵人，持續灼傷'},
{n:'毒霧槍',k:'venom',d:.8,n2:3,r:.18,sp:.35,j:.15,w:3,x:2,t:'三連發毒液，持續傷害'},
{n:'磁軌砲',k:'rail',d:18,n2:1,r:1.3,sp:0,j:0,w:3,x:1,sv:1800,t:'超高速一發貫穿所有敵人'},
{n:'稜鏡槍',k:'prism',d:1.5,n2:5,r:.28,sp:.5,j:0,w:3,x:2,t:'五道貫穿光束，輸出極高'},
{n:'迫擊砲',k:'mortar',d:12,n2:1,r:.9,sp:.1,j:0,w:8,x:1,t:'大範圍爆炸'},
{n:'雷神之錘',k:'thunder',d:5,n2:1,r:.35,sp:.1,j:0,w:5,x:1,t:'連鎖電擊 4 個敵人'});
const BC={homing:'#ff6bd6',chain:'#6ee7ff',cannon:'#ffb347',plasma:'#c084ff',ball:'#ffd166',burn:'#ff7a45',venom:'#7cff6b',rail:'#fff',prism:'#ffd1ff',mortar:'#ffb347',thunder:'#6ee7ff'};
WP.forEach(w=>{w.n1=w.n2});
let SV={coins:0,own:WP.map((w,i)=>i?-1:0),eq:0};

SV.sk=SV.sk||{u:[],e:[]};SV.up=SV.up||{cc:0,cd:0,dm:0,hp:0};SV.xp=SV.xp||0;SV.ms=SV.ms||null;function save(){if(!ACC)return;try{localStorage.setItem('stardust-u:'+ACC,JSON.stringify({sv:SV,best,lvl:maxLvl}))}catch(e){}}
const SK=[{id:'dmg',n:'攻擊強化',d:'攻擊力 +20%'},{id:'rate',n:'速射',d:'射速 +15%'},{id:'pw',n:'火力升級',d:'彈數增加（最多到滿 10 顆）'},{id:'shield',n:'能量護盾',d:'獲得 1 層護盾'},{id:'heal',n:'緊急修復',d:'生命 +1（最多 5）'},{id:'coin',n:'貪婪',d:'金幣獲得 +25%'},{id:'pierce',n:'穿透彈',d:'子彈多穿透 1 隻敵人'},{id:'crit',n:'暴擊',d:'10% 機率造成雙倍傷害'}];
cv.parentNode.insertAdjacentHTML('beforeend',`<div id='pick' class='hide'><h2>選擇技能</h2><div id='pc'></div></div><div id='shop' class='hide'><h2>武器商店</h2><p id='coins'></p><div id='wl'></div><button id='shopx' style='background:#2a2e55'>返回</button></div>`);
SK.push({id:'dr',n:'輔助機',d:'獲得 1 台輔助機（最多 4 台）'});const pickEl=document.getElementById('pick'),shopEl=document.getElementById('shop');
document.getElementById('shopx').onclick=()=>shopEl.classList.add('hide');
{const b=document.createElement('button');b.textContent='武器商店';b.style.background='#2a2e55';b.style.marginTop='8px';b.onclick=()=>{openHub('weapon')};ui.appendChild(b)}

function buildSel(){const s=document.getElementById('sel');s.innerHTML='';LV.forEach((l,i)=>{const b=document.createElement('button');b.textContent=i+1;b.title=l.n;b.disabled=i>maxLvl;b.onclick=()=>start(i);s.appendChild(b)})}buildSel();

function reset(){
  P={x:W/2,y:H-110,r:14,cd:0,pw:1,shield:0,lives:3+SV.up.hp,inv:0,dr:SV.dr||0,bm:1,slow:0};
  bul=[];ebul=[];en=[];fx=[];pu=[];score=0;time=0;spawnT=1;tx=W/2;ty=H-110;K={dmg:0,rate:0,coin:0,pierce:0,crit:0};lk=0;picking=false;DR=[];cmb=0;cmbT=0;FT=[];shk=0;ev=0;initSkills();pickEl.classList.add('hide');beginLevel(startLvl);
}
function start(i,rk){RK=!!rk;startLvl=i||0;msRefresh();hub.classList.add('hide');shopEl.classList.add('hide');reset();S='play';bgm('play');ui.classList.add('hide');paused=false}
go.onclick=()=>start(startLvl);

function spawn(){
  const L=LV[lvl],lv=Math.min(lvl+1,30),r=Math.random();
  let e={x:30+Math.random()*(W-60),y:-30,t:0,hp:1,r:15,vy:80+lv*10,ph:Math.random()*6,sc:10,cd:2};
  if(r<L.m1+L.m2)Object.assign(e,{t:1,hp:2+(lvl>6?1:0),r:16,vy:(60+lv*5)*L.spd,sc:25});
  if(r<L.m2)Object.assign(e,{t:2,hp:6+Math.min(lvl,30)*.7,r:24,vy:(38+lv*3)*L.spd,sc:60});
  if(e.t<2&&Math.random()<Math.min(.7,.12+lvl*.02)){const a=UN.filter(u=>lvl>=u[1]);if(a.length)special(e,a[Math.floor(Math.random()*a.length)][0])}e.hp=Math.ceil(e.hp*(1+Math.pow(lvl,.85)*.17));e.mhp=e.hp;if(e.k==='swarm'){spawnSwarm();return}e.x0=e.x;en.push(e);
}

  function solid(px,py){const c=(M[py|0]||'')[px|0];return c!=='.'}
  function canAt(px,py,r){return !solid(px-r,py-r)&&!solid(px+r,py-r)&&!solid(px-r,py+r)&&!solid(px+r,py+r)}
  function mv(e,vx,vy,dt){const l=Math.hypot(vx,vy);if(!l)return 0;vx=vx/l*dt;vy=vy/l*dt;let m=0;if(canAt(e.x+vx,e.y,.22)){e.x+=vx;m+=Math.abs(vx)}if(canAt(e.x,e.y+vy,.22)){e.y+=vy;m+=Math.abs(vy)}return m}
  function gs(){return Math.random()+Math.random()+Math.random()-1.5}
  function reload(){const w=WPN[me.w];if(!w.mag||me.rl>0||me.ammo[me.w]>=w.mag)return;me.rl=w.rl;snd('rl')}
  function snd(k){if(!AU.s)return;if(k==='ar')noise(.05,.07,2600);else if(k==='sg')noise(.18,.12,1200);else if(k==='sn'){noise(.25,.12,900);beep(90,.2,'sawtooth',.05)}else if(k==='pi')noise(.07,.08,2000);else if(k==='kn')beep(900,.05,'square',.03);else if(k==='hit')beep(1400,.04,'square',.04);else if(k==='rl')beep(300,.12,'square',.03);else if(k==='hurt')beep(120,.15,'sawtooth',.05)}
  function shoot(){const w=WPN[me.w];if(me.cd>0||me.rl>0||state!=='fight')return;
    if(w.mag){if(me.ammo[me.w]<=0){reload();return}me.ammo[me.w]--}
    me.cd=w.r;kick=1;flash=.06;snd(['ar','sg','sn','pi','kn'][me.w]);let tot=0,head=false;
    const moving=Math.hypot(me.vx||0,me.vy||0)>.1,sp=w.sp*(moving?2.2:1)*(zoomOn&&w.zoom?.1:1);
    for(let p=0;p<w.pel;p++){const an=me.a+gs()*2*sp,c=Math.cos(an),s=Math.sin(an),wd=dda(me.x,me.y,c,s).d,dx=bot.x-me.x,dy=bot.y-me.y,al=dx*c+dy*s,pr=Math.abs(-dx*s+dy*c);
      if(w.melee){if(Math.hypot(dx,dy)<w.rng&&Math.cos(Math.atan2(dy,dx)-me.a)>.55){tot+=w.d}continue}
      if(al>0&&al<wd&&al<=w.rng+3&&pr<.26){let d=w.d*(w.pel>1?Math.max(.35,1-al/(w.rng+3)):1);if(pr<.08&&w.pel===1){d*=1.5;head=true}tot+=d}}
    if(tot>0){bot.hp-=tot;hitm=.15;snd('hit');if(head)say('爆頭！',.6);bot.seen+=0;if(bot.hp<=0)endRound(true)}}
  function botShoot(ang,dist){const w=WPN[bot.w],er=DIF[dif].err;let tot=0;
    for(let p=0;p<w.pel;p++){const sa=ang+gs()*2*(er+(w.pel>1?.05:0)),pr=dist*Math.abs(Math.sin(sa-ang));if(pr<.24){let d=w.d*.75*(w.pel>1?Math.max(.3,1-dist/(w.rng+3)):1);if(w.pel>1&&dist>w.rng+3)d=0;tot+=d}}
    bot.cd=w.r*(bot.b===0?1:1.2)*(w.auto?1:1.15);if(w.auto){if(++bot.burst>=7){bot.burst=0;bot.cd+=.55}}
    if(AU.s&&dist<9)noise(.04,.03,2000);
    if(tot>0){me.hp-=tot;hurt=.5;snd('hurt');if(me.hp<=0)endRound(false)}}
  function endRound(win){if(state!=='fight')return;state='end';tmr=2.4;if(win)sc++;else bs++;lab();say(win?'你贏了這回合！':'電腦贏了這回合',2.2);sfx(win?'coin':'over')}
  function nextStep(ax,ay,tx,ty){const sx=ax|0,sy=ay|0,gx=tx|0,gy=ty|0,S0=sy*16+sx,G=gy*16+gx;if(S0===G)return{x:tx,y:ty};
    const prev=new Int16Array(256).fill(-1),q=[S0];prev[S0]=-2;let found=false;
    while(q.length){const c=q.shift();if(c===G){found=true;break}const cx=c%16,cy=(c/16)|0;
      for(const d of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+d[0],ny=cy+d[1];if(nx<0||ny<0||nx>15||ny>15||M[ny][nx]!=='.')continue;const n=ny*16+nx;if(prev[n]!==-1)continue;prev[n]=c;q.push(n)}}
    if(!found)return{x:tx,y:ty};let c=G;while(prev[c]!==S0&&prev[c]>=0)c=prev[c];return{x:(c%16)+.5,y:((c/16)|0)+.5}}
  function botAI(dt){const b=bot,dx=me.x-b.x,dy=me.y-b.y,dist=Math.hypot(dx,dy)||.01,ang=Math.atan2(dy,dx);
    b.vis=dda(b.x,b.y,Math.cos(ang),Math.sin(ang)).d>dist-.3;if(b.vis)b.seen+=dt;else b.seen=0;
    let vx=0,vy=0;const pref=b.w===1?2.2:b.w===2?8:4.5;
    if(b.vis){b.st-=dt;if(b.st<=0){b.st=.5+Math.random()*1.2;b.dir=Math.random()<.5?-1:1}vx=-dy/dist*b.dir*.8;vy=dx/dist*b.dir*.8;if(dist>pref+1){vx+=dx/dist*.6;vy+=dy/dist*.6}else if(dist<pref-1){vx-=dx/dist*.6;vy-=dy/dist*.6}}
    else{b.tw-=dt;if(b.tw<=0||!b.wp){b.tw=.3;b.wp=nextStep(b.x,b.y,me.x,me.y)}const wx=b.wp.x-b.x,wy=b.wp.y-b.y,wl=Math.hypot(wx,wy)||1;vx=wx/wl;vy=wy/wl}
    mv(b,vx,vy,dt*b.spd);
    b.cd-=dt;if(state==='fight'&&b.vis&&b.seen>b.react&&b.cd<=0)botShoot(ang,dist)}
  function update(dt){
    tt+=dt;if(msgT>0)msgT-=dt;kick=Math.max(0,kick-dt*6);flash=Math.max(0,flash-dt);hurt=Math.max(0,hurt-dt);hitm=Math.max(0,hitm-dt);
    me.cd-=dt;if(me.rl>0){me.rl-=dt;if(me.rl<=0)me.ammo[me.w]=WPN[me.w].mag}
    if(state==='cd'){tmr-=dt;if(tmr<=0){state='fight';say('開打！',.7)}}
    else if(state==='end'){tmr-=dt;if(tmr<=0){if(sc>=5||bs>=5)matchEnd();else newRound()}}
    if(state==='fight'||state==='cd'){
      if(dbg.auto){me.a=Math.atan2(bot.y-me.y,bot.x-me.x);fire=true}
      const w=WPN[me.w];let f=(keys.w?1:0)-(keys.s?1:0)-joy.y,sd=(keys.d?1:0)-(keys.a?1:0)+joy.x;
      if(keys.ArrowLeft)me.a-=2.4*dt;if(keys.ArrowRight)me.a+=2.4*dt;
      const dx=Math.cos(me.a),dy=Math.sin(me.a),vx=dx*f-dy*sd,vy=dy*f+dx*sd,sp=3.4*(w.spd||1)*(zoomOn&&w.zoom?.55:1);me.vx=vx;me.vy=vy;
      if(state==='fight'||true)mv(me,vx,vy,sp*dt);
      if(state==='fight'){if(fire)shoot();
        botAI(dt);fightT-=dt;if(fightT<=0)endRound(me.hp>=bot.hp)}}
    const tz=zoomOn&&WPN[me.w].zoom?.5:1;fov+=((1.15*tz)-fov)*Math.min(1,dt*12)}
  function matchEnd(){run=false;cancelAnimationFrame(raf);const win=sc>=5;let nb=false;if(win){streak++;nb=mrec('rivals',streak)}else streak=0;try{localStorage.setItem('arcade-streak:rivals',String(streak))}catch(e){}
    sfx(win?'clear':'over');lab();if(document.exitPointerLock)document.exitPointerLock();
    ui.over((win?'你贏了！':'電腦獲勝')+'　'+sc+' : '+bs+(win?'　連勝 '+streak:'')+(nb&&win?'（新紀錄）':''),()=>{startMatch();run=true;last=performance.now();raf=requestAnimationFrame(frame)})}
  function frame(ts){if(!run)return;const dt=Math.min(.05,(ts-last)/1000);last=ts;update(dt);if(run){render();raf=requestAnimationFrame(frame)}}
  function bar2(px,py,w,v,col){x.fillStyle='rgba(0,0,0,.5)';x.fillRect(px,py,w,7);x.fillStyle=col;x.fillRect(px,py,w*Math.max(0,v)/100,7)}
  function render(){const dirx=Math.cos(me.a),diry=Math.sin(me.a),pl=Math.tan(fov/2),plx=-diry*pl,ply=dirx*pl;
    let g=x.createLinearGradient(0,0,0,H/2);g.addColorStop(0,'#6fb7ff');g.addColorStop(1,'#cfe9ff');x.fillStyle=g;x.fillRect(0,0,W,H/2);
    g=x.createLinearGradient(0,H/2,0,H);g.addColorStop(0,'#6b6f8f');g.addColorStop(1,'#3a3e5c');x.fillStyle=g;x.fillRect(0,H/2,W,H/2);
    for(let i=0;i<COLS;i++){const cx=2*i/COLS-1,h=dda(me.x,me.y,dirx+plx*cx,diry+ply*cx);zb[i]=h.d;const lh=H/h.d,c=WC[h.ch]||WC['#'],sh=Math.max(.3,1-h.d/15)*(h.side?.72:1);x.fillStyle='rgb('+(c[0]*sh|0)+','+(c[1]*sh|0)+','+(c[2]*sh|0)+')';x.fillRect(i*CW,H/2-lh/2,CW,lh)}
    // bot sprite
    const dx=bot.x-me.x,dy=bot.y-me.y,inv=1/(plx*diry-dirx*ply),tx=inv*(diry*dx-dirx*dy),ty=inv*(-ply*dx+plx*dy);
    if(ty>.25&&bot.hp>0){const sx=(W/2)*(1+tx/ty),lh=H/ty,hs=W/(2*pl*ty),fy=H/2+lh/2;
      const parts=[[-.15,-.02,0,.32,'#8a1f1f'],[.02,.15,0,.32,'#8a1f1f'],[-.17,.17,.32,.62,'#e83a3a'],[-.27,-.18,.34,.6,'#c92f2f'],[.18,.27,.34,.6,'#c92f2f'],[-.1,.1,.62,.8,'#ffd9b0']];
      parts.forEach(p=>{const l=sx+p[0]*hs,r=sx+p[1]*hs,t=fy-p[3]*lh,hh=(p[3]-p[2])*lh;for(let c=Math.max(0,Math.floor(l/CW));c<=Math.min(COLS-1,Math.floor(r/CW));c++){if(zb[c]>ty){x.fillStyle=p[4];x.fillRect(c*CW,t,CW,hh)}}});
      if(bot.hp<100){const bx=sx-18,by=fy-.9*lh;if(bx>0&&bx<W)bar2(bx,by,36,bot.hp,'#ff4f4f')}}
    // gun model
    const w=WPN[me.w],gk=kick*8;x.save();x.translate(W*.62,H-gk);
    if(w.melee){x.fillStyle='#ddd';x.fillRect(20,-70+kick*20,10,60);x.fillStyle='#555';x.fillRect(16,-14,18,16)}
    else if(!(zoomOn&&w.zoom)){x.fillStyle='#2b2f45';x.fillRect(0,-46,26,46);x.fillStyle=me.w===0?'#ffc83d':me.w===1?'#ff9f43':me.w===3?'#aab':'#7cff6b';x.fillRect(-6,-52,38,14);x.fillStyle='#111';x.fillRect(26,-50,(me.w===2?70:me.w===1?46:34),7)}
    x.restore();
    if(flash>0){x.fillStyle='rgba(255,230,120,.85)';x.beginPath();x.arc(W*.62+60,H-52,14,0,6.28);x.fill()}
    // crosshair / scope
    if(zoomOn&&w.zoom){x.fillStyle='#000';x.beginPath();x.rect(0,0,W,H);x.arc(W/2,H/2,H*.46,0,6.28,true);x.fill('evenodd');x.strokeStyle='#000';x.lineWidth=1;x.beginPath();x.moveTo(W/2,H/2-H*.46);x.lineTo(W/2,H/2+H*.46);x.moveTo(W/2-H*.46,H/2);x.lineTo(W/2+H*.46,H/2);x.stroke()}
    else if(!w.melee){x.strokeStyle=hitm>0?'#ff4f4f':'#fff';x.lineWidth=2;x.beginPath();x.moveTo(W/2-9,H/2);x.lineTo(W/2-3,H/2);x.moveTo(W/2+3,H/2);x.lineTo(W/2+9,H/2);x.moveTo(W/2,H/2-9);x.lineTo(W/2,H/2-3);x.moveTo(W/2,H/2+3);x.lineTo(W/2,H/2+9);x.stroke()}
    if(hurt>0){x.fillStyle='rgba(255,40,40,'+hurt*.6+')';x.fillRect(0,0,W,H)}
    // HUD
    x.textAlign='left';x.font='700 12px sans-serif';x.fillStyle='#fff';x.fillText('你',10,H-26);bar2(10,H-20,110,me.hp,'#38e0c8');
    x.textAlign='right';x.fillText(w.n+(w.mag?'  '+(me.rl>0?'換彈中…':me.ammo[me.w]+' / '+w.mag):''),W-10,H-10);
    x.textAlign='center';x.fillText('電腦',W/2-60,16);bar2(W/2-45,10,90,bot.hp,'#ff4f4f');x.font='700 16px sans-serif';x.fillText(sc+' : '+bs,W/2+80,18);x.font='12px sans-serif';x.fillText(Math.max(0,Math.ceil(fightT))+' 秒',W/2+130,16);
    if(state==='cd'){x.font='700 64px sans-serif';x.fillStyle='rgba(255,255,255,.9)';x.fillText(Math.ceil(tmr),W/2,H/2+20)}
    if(msgT>0){x.font='700 22px sans-serif';x.fillStyle='#ffc83d';x.fillText(msg,W/2,H*.3)}
    if(!document.pointerLockElement&&!('ontouchstart' in window)&&state!=='end'){x.font='13px sans-serif';x.fillStyle='rgba(255,255,255,.85)';x.fillText('點一下畫面鎖定滑鼠後開始瞄準（Esc 解除）',W/2,H-40)}}
  // input
  const kd=e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=1;if(k==='r')reload();if(k>='1'&&k<='5')pick(+k-1);if(['ArrowLeft','ArrowRight',' '].includes(k))e.preventDefault()},ku=e=>{keys[e.key.length===1?e.key.toLowerCase():e.key]=0};
  const mm=e=>{if(document.pointerLockElement===cv&&me)me.a+=e.movementX*.0026};
  addEventListener('keydown',kd);addEventListener('keyup',ku);addEventListener('mousemove',mm);
  cv.oncontextmenu=e=>e.preventDefault();
  cv.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'){if(document.pointerLockElement!==cv){if(cv.requestPointerLock)cv.requestPointerLock();return}if(e.button===0)fire=true;if(e.button===2)zoomOn=true;return}
    const r=cv.getBoundingClientRect();if(e.clientX-r.left<r.width*.45){if(joy.id<0){joy.id=e.pointerId;joy.ox=e.clientX;joy.oy=e.clientY}}else if(look.id<0){look.id=e.pointerId;look.lx=e.clientX}});
  cv.addEventListener('pointermove',e=>{if(e.pointerId===joy.id){joy.x=Math.max(-1,Math.min(1,(e.clientX-joy.ox)/40));joy.y=Math.max(-1,Math.min(1,-(e.clientY-joy.oy)/40))}else if(e.pointerId===look.id&&me){me.a+=(e.clientX-look.lx)*.009;look.lx=e.clientX}});

  box.__riv=()=>({me,bot,state,sc,bs,dbg,tmr,get fire(){return fire}});
  return()=>{run=false;cancelAnimationFrame(raf);removeEventListener('keydown',kd);removeEventListener('keyup',ku);removeEventListener('mousemove',mm);if(document.exitPointerLock&&document.pointerLockElement)document.exitPointerLock()}};
