<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>星塵守衛・網頁射擊遊戲</title>
<meta name="description" content="星塵守衛：可在瀏覽器遊玩的射擊遊戲，10 個關卡、多種武器與技能、每小時任務。">
<meta property="og:title" content="星塵守衛">
<meta property="og:description" content="10 個關卡、9 把武器、20 種技能的網頁射擊遊戲。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%80%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#0e1026;--ink:#f1ecdf;--teal:#38e0c8;--pink:#ff4f8b;--gold:#ffc83d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;overscroll-behavior:none}
#wrap{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(100vw,66.6667vh);height:100%;overflow:hidden}
@supports(height:100dvh){#wrap{width:min(100vw,66.6667dvh)}}
canvas{touch-action:none}
canvas{width:100%;height:100%;display:block;background:#0b0d20;cursor:crosshair}
#ui{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(11,13,32,.82);padding:24px}
#ui.hide{display:none}
#sel{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:22em;margin-top:8px}
#sel button{margin:0;font-size:14px;padding:6px 12px;background:#2a2e55;min-width:40px}
#sel button:disabled{opacity:.35;cursor:default}
#pick,#shop{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(11,13,32,.92);padding:20px;overflow:auto}
#pick.hide,#shop.hide{display:none}
h2{margin:0 0 10px;color:var(--teal)}
.card{display:block;width:min(320px,86%);margin:6px 0;padding:10px 14px;text-align:left;background:#1b1f45;border:2px solid #38406f;border-radius:8px;color:var(--ink);font-size:15px;font-weight:400}
.card:hover{border-color:var(--teal)}
.card b{display:block;font-size:17px;color:var(--gold)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;width:min(400px,94%);padding:8px 10px;margin:4px 0;background:#1b1f45;border-radius:8px;text-align:left;font-size:13px;line-height:1.5}
.row.eq{border:2px solid var(--teal)}
.row b{color:var(--gold);font-size:15px}
.row button{margin:0;font-size:13px;padding:6px 10px;white-space:nowrap}
.row button:disabled{opacity:.4;cursor:default}
#hub{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;background:linear-gradient(#0e1026,#0b0d20);z-index:5}
#hub.hide{display:none}
#hh{display:flex;justify-content:space-between;padding:12px 16px;font-weight:700;color:var(--gold)}
#hc{flex:1;overflow:auto;padding:4px 12px 16px;text-align:center;touch-action:pan-y}
#nav{display:flex;border-top:2px solid #26305f;background:#10143a;padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{flex:1;margin:0;border-radius:0;background:transparent;color:#9aa5c9;font-size:14px;padding:14px 2px}
#nav button.on{color:var(--teal);box-shadow:inset 0 3px 0 var(--teal)}
#hub button:disabled{opacity:.4;cursor:default}
.arr{width:48px;height:48px;border-radius:50%;margin:0!important;padding:0!important;font-size:18px!important;background:#2a2e55!important}
.slot{flex:1;min-height:50px;border:2px dashed #38406f;border-radius:8px;font-size:13px;display:flex;align-items:center;justify-content:center;padding:4px;color:#6b749c}
.slot.f{border-style:solid;border-color:var(--teal);color:var(--gold);cursor:pointer}
#auth{position:absolute;top:0;right:0;bottom:0;left:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#12153a;padding:20px;text-align:center;overflow:auto}
#auth.hide{display:none}
#auth input{width:min(280px,80%);padding:12px;margin:6px 0;border-radius:6px;border:2px solid #38406f;background:#0b0d20;color:var(--ink);font:inherit;font-size:16px}
#auth input:focus-visible{outline:3px solid var(--gold)}
#aerr{color:#ff8a8a;min-height:1.5em;font-size:14px}
.tabs{display:flex;gap:8px;margin:10px 0}
.tabs button{margin:0;padding:8px 22px;font-size:15px;background:#2a2e55}
.tabs button.on{background:var(--pink)}
h1{font-size:clamp(34px,9vw,52px);margin:0 0 6px;letter-spacing:.12em;color:var(--teal)}
p{margin:6px 0;line-height:1.7;max-width:20em;font-size:15px}
#best{color:var(--gold)}
button{margin-top:18px;font:inherit;font-size:18px;font-weight:700;padding:12px 36px;border:0;border-radius:6px;background:var(--pink);color:#fff;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="480" height="720"></canvas>
<div id="ui">
<h1 id="t">星塵守衛</h1>
<p id="m">移動滑鼠或手指拖曳來操控飛船，飛船會自動射擊。<br>鍵盤：方向鍵或 WASD，P 暫停。</p>
<p>金色方塊升級火力，青色圓環補一層護盾。</p>
<p id="best"></p><p style="font-size:13px;opacity:.8">已解鎖的關卡，點數字可直接進入</p><div id="sel"></div>
<button id="go">開始遊戲</button>
</div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=480,H=720;
const ui=document.getElementById('ui'),go=document.getElementById('go');
const C={teal:'#38e0c8',pink:'#ff4f8b',gold:'#ffc83d',ink:'#f1ecdf'};
let best=0;
function showBest(){document.getElementById('best').textContent=best?'最高分：'+best:''}showBest();

let ac=null;
function beep(f,d,type,v){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type||'square';o.frequency.value=f;g.gain.value=v||.03;g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}

let S='menu',P,bul,ebul,en,fx,pu,score,time,spawnT,paused=false;
const stars=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,z:Math.random()*2+.5}));
const keys={};let tx=W/2,ty=H-110,usePtr=false;
const NAMES=['星塵初開','蛇行群','重型來襲','隕石帶','雙子風暴','彈幕走廊','鋼鐵艦隊','暗物質','星門守衛','終焉之王'];
const LV=NAMES.map((n,i)=>({n,dur:18+i*3,rate:.9-i*.055,spd:1+i*.06,m1:Math.min(.55,.1+i*.07),m2:i>=1?Math.min(.35,i*.06):0,bhp:90+i*60}));
let lvl=0,lt=0,phase='fight',banner=0,ct=0,startLvl=0,maxLvl=0;
let picking=false,lk=0,K={dmg:0,rate:0,coin:0,pierce:0,crit:0};
const MAXL=5;
const WP=[
{n:'脈衝砲',k:'pulse',d:1,n2:1,r:.17,sp:.1,j:0,w:2,x:1,t:'均衡的基本武器'},
{n:'連發機槍',k:'mg',d:.7,n2:2,r:.08,sp:.08,j:.12,w:2,x:1,t:'超高射速'},
{n:'散彈槍',k:'sg',d:1,n2:5,r:.5,sp:.7,j:.1,w:2,x:2,t:'扇形多發，近距離強'},
{n:'穿透雷射',k:'laser',d:3.5,n2:1,r:.3,sp:.12,j:0,w:6,x:1,t:'高傷害，可貫穿敵人'},
{n:'爆裂火箭',k:'rocket',d:8,n2:1,r:.65,sp:.2,j:0,w:5,x:1,t:'命中時範圍爆炸'}];
WP.push(
{n:'追蹤飛彈',k:'homing',d:2.2,n2:2,r:.5,sp:.5,j:.2,w:4,x:1,t:'自動追蹤最近的敵人'},
{n:'電弧鏈',k:'chain',d:4,n2:1,r:.4,sp:.1,j:0,w:4,x:1,t:'命中後電擊鄰近 2 個敵人'},
{n:'重型加農砲',k:'cannon',d:14,n2:1,r:1,sp:.1,j:0,w:10,x:1,t:'超高單發傷害，穿透 2 隻'},
{n:'電漿三連射',k:'plasma',d:1.3,n2:3,r:.15,sp:.3,j:.05,w:3,x:2,t:'高傷害三連發，最強火力'});
const BC={homing:'#ff6bd6',chain:'#6ee7ff',cannon:'#ffb347',plasma:'#c084ff',ball:'#ffd166'};
WP.forEach(w=>{w.n1=w.n2});
let SV={coins:0,own:WP.map((w,i)=>i?-1:0),eq:0};

SV.sk=SV.sk||{u:[],e:[]};SV.up=SV.up||{cc:0,cd:0,dm:0,hp:0};SV.xp=SV.xp||0;SV.ms=SV.ms||null;function save(){if(!ACC)return;try{localStorage.setItem('stardust-u:'+ACC,JSON.stringify({sv:SV,best,lvl:maxLvl}))}catch(e){}}
const SK=[{id:'dmg',n:'攻擊強化',d:'攻擊力 +20%'},{id:'rate',n:'速射',d:'射速 +15%'},{id:'pw',n:'火力升級',d:'彈數增加（最多到滿 10 顆）'},{id:'shield',n:'能量護盾',d:'獲得 1 層護盾'},{id:'heal',n:'緊急修復',d:'生命 +1（最多 5）'},{id:'coin',n:'貪婪',d:'金幣獲得 +25%'},{id:'pierce',n:'穿透彈',d:'子彈多穿透 1 隻敵人'},{id:'crit',n:'暴擊',d:'10% 機率造成雙倍傷害'}];
cv.parentNode.insertAdjacentHTML('beforeend',`<div id='pick' class='hide'><h2>選擇技能</h2><div id='pc'></div></div><div id='shop' class='hide'><h2>武器商店</h2><p id='coins'></p><div id='wl'></div><button id='shopx' style='background:#2a2e55'>返回</button></div>`);
SK.push({id:'dr',n:'輔助機',d:'獲得 1 台輔助機（最多 4 台）'});const pickEl=document.getElementById('pick'),shopEl=document.getElementById('shop');
document.getElementById('shopx').onclick=()=>shopEl.classList.add('hide');
{const b=document.createElement('button');b.textContent='武器商店';b.style.background='#2a2e55';b.style.marginTop='8px';b.onclick=()=>{openHub('weapon')};ui.appendChild(b)}

function buildSel(){const s=document.getElementById('sel');s.innerHTML='';LV.forEach((l,i)=>{const b=document.createElement('button');b.textContent=i+1;b.title=l.n;b.disabled=i>maxLvl;b.onclick=()=>start(i);s.appendChild(b)})}buildSel();

function reset(){
  P={x:W/2,y:H-110,r:14,cd:0,pw:1,shield:0,lives:3+SV.up.hp,inv:0,dr:SV.dr||0,bm:1,slow:0};
  bul=[];ebul=[];en=[];fx=[];pu=[];score=0;time=0;spawnT=1;tx=W/2;ty=H-110;K={dmg:0,rate:0,coin:0,pierce:0,crit:0};lk=0;picking=false;DR=[];cmb=0;cmbT=0;FT=[];shk=0;ev=0;initSkills();pickEl.classList.add('hide');beginLevel(startLvl);
}
function start(i){startLvl=i||0;msRefresh();hub.classList.add('hide');shopEl.classList.add('hide');reset();S='play';ui.classList.add('hide');paused=false}
go.onclick=()=>start(startLvl);

function spawn(){
  const L=LV[lvl],lv=lvl+1,r=Math.random();
  let e={x:30+Math.random()*(W-60),y:-30,t:0,hp:1,r:15,vy:80+lv*10,ph:Math.random()*6,sc:10,cd:2};
  if(r<L.m1+L.m2)Object.assign(e,{t:1,hp:2+(lvl>6?1:0),r:16,vy:(60+lv*5)*L.spd,sc:25});
  if(r<L.m2)Object.assign(e,{t:2,hp:6+lvl,r:24,vy:(38+lv*3)*L.spd,sc:60});
  if(e.t<2&&Math.random()<Math.min(.55,.12+lvl*.05)){const a=UN.filter(u=>lvl>=u[1]);if(a.length)special(e,a[Math.floor(Math.random()*a.length)][0])}e.hp=Math.ceil(e.hp*(1+lvl*.22));e.x0=e.x;en.push(e);
}
function boom(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=40+Math.random()*180;fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.5+Math.random()*.4,m:.9,c:col})}}
function hurt(){
  if(P.inv>0)return;
  if(P.shield>0){P.shield--;P.inv=1;beep(300,.2,'sine',.05);return}
  P.lives--;P.inv=2;cmb=0;shk=.4;P.pw=Math.max(1,P.pw-1);boom(P.x,P.y,C.ink,30);beep(90,.5,'sawtooth',.06);
  if(P.lives<=0)over();
}
function ring(x,y,n,s){for(let i=0;i<n;i++){const a=i/n*6.283;ebul.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s})}}
function aim(e,s){const a=Math.atan2(P.y-e.y,P.x-e.x);ebul.push({x:e.x,y:e.y+10,vx:Math.cos(a)*s,vy:Math.sin(a)*s})}
const KC={dive:'#ff7a45',side:'#6ee7ff',bomb:'#ffd166',armor:'#9aa5c9',home:'#ff6bd6',spin:'#7cff6b'};
const UN=[['dive',1],['side',2],['bomb',3],['armor',3],['home',4],['spin',5]];
function special(e,k){e.k=k;e.t=0;e.cd=.8;
  if(k==='dive')Object.assign(e,{hp:2,r:14,sc:30,vy:130});
  if(k==='side'){const d=Math.random()<.5?1:-1;Object.assign(e,{hp:2,r:14,sc:30,vy:0,x:d>0?-20:W+20,y:70+Math.random()*180,vx:d*(110+lvl*10)})}
  if(k==='bomb')Object.assign(e,{hp:3,r:17,sc:35,vy:75});
  if(k==='armor')Object.assign(e,{hp:9,r:21,sc:55,vy:32});
  if(k==='home')Object.assign(e,{hp:2,r:14,sc:30,vy:70});
  if(k==='spin')Object.assign(e,{hp:8,r:20,sc:70,vy:100,x:90+Math.random()*(W-180)})}
function behave(e,dt){
  if(!e.k)return;e.age=(e.age||0)+dt;const k=e.k;
  if(k==='dive'){if(!e.dv){e.vy=e.y<100?130:0;if(e.y>=100){e.w=(e.w||0)+dt;e.x+=(P.x-e.x)*dt*2;if(e.w>.9){e.dv=1;e.vy=470+lvl*12}}}}
  else if(k==='side'){e.x+=e.vx*dt;e.cd-=dt;if(e.cd<=0){e.cd=1.2;aim(e,190+lvl*8)}if(e.age>8)e.dead=1}
  else if(k==='rock')e.rot+=e.rv*dt;
  else if(k==='home')e.x+=Math.sign(P.x-e.x)*Math.min(Math.abs(P.x-e.x),(100+lvl*9)*dt);
  else if(k==='armor'){e.cd-=dt;if(e.cd<=0){e.cd=2;aim(e,180+lvl*8)}}
  else if(k==='spin'){if(e.y<150&&!e.out)e.vy=100;else{e.vy=e.out?110:0;e.st=(e.st||0)+dt;e.sa=(e.sa||0)+dt*3.2;e.cd-=dt;if(e.cd<=0){e.cd=.13;for(let s=0;s<2;s++){const a=e.sa+s*3.14,v=130+lvl*6;ebul.push({x:e.x,y:e.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v})}}if(e.st>4)e.out=1}}
}
function curN(){const w=WP[SV.eq];return Math.min(10,w.n1+(P.pw-1)*w.x)}
function pwMax(){const w=WP[SV.eq];return Math.max(1,1+Math.ceil((10-w.n1)/w.x))}
let DR=[];
function drones(dt){const off=[-34,34,-58,58];while(DR.length<P.dr)DR.push({x:P.x,y:P.y,c:Math.random()*.4});
  DR.forEach((d,i)=>{d.x+=(P.x+off[i]-d.x)*Math.min(1,dt*9);d.y+=(P.y+14-d.y)*Math.min(1,dt*9);d.c-=dt;
    if(d.c<=0){d.c=.42;bul.push({x:d.x,y:d.y-8,vx:0,vy:-640,dm:Math.max(.6,wdmg()*.45),p:0,w:3,k:'pulse'})}})}
let ev=0,rt=0,bnTxt='',cmb=0,cmbT=0,FT=[],shk=0;
let RS={},homeLvl=0,hubTab='home';
const SKD=[
{id:'laser',n:'激光炮',d:'定時發射貫穿光束',c:600,cd:2.2,ups:[['傷害 +40%','dm',.4],['+1 反彈','bn',1],['冷卻 -20%','cd',-.2]]},
{id:'swarm',n:'導彈群',d:'定時發射多枚追蹤導彈',c:700,cd:3,ups:[['+2 枚導彈','n',1],['傷害 +40%','dm',.4],['冷卻 -20%','cd',-.2]]},
{id:'nova',n:'星環爆發',d:'向四周射出一圈子彈',c:500,cd:2.6,ups:[['+4 發','n',1],['傷害 +40%','dm',.4],['+1 反彈','bn',1]]},
{id:'bolt',n:'連鎖雷擊',d:'隨機雷擊多個敵人',c:800,cd:3,ups:[['+2 個目標','n',1],['傷害 +40%','dm',.4],['冷卻 -20%','cd',-.2]]},
{id:'ball',n:'彈跳光球',d:'會多次反彈的穿透光球',c:500,cd:3.5,ups:[['+2 反彈','bn',2],['傷害 +40%','dm',.4],['+1 顆光球','n',1]]},
{id:'wave',n:'衝擊波',d:'震散敵方子彈並傷害周圍敵人',c:600,cd:4,ups:[['範圍 +30%','r',.3],['傷害 +40%','dm',.4],['冷卻 -20%','cd',-.2]]},
{id:'blade',n:'旋轉刃',d:'環繞飛船旋轉的刀刃',c:700,ups:[['+1 把刀刃','n',1],['傷害 +40%','dm',.4],['範圍 +30%','r',.3]]},
{id:'barr',n:'能量屏障',d:'消除靠近飛船的敵方子彈',c:600,ups:[['範圍 +30%','r',.3],['範圍 +50%','r',.5]]},
{id:'crit',n:'暴擊大師',d:'提高暴擊機率',c:400,ups:[['暴擊率提升','v',.5]]},
{id:'life',n:'吸血',d:'擊殺敵人累積後回復生命',c:500,ups:[['回復更快','v',.5]]},
{id:'gold',n:'財富之手',d:'金幣收入 +30%',c:400,ups:[['收入再提升','v',.5]]},
{id:'hull',n:'鋼鐵之軀',d:'開局生命 +1',c:800,ups:[['立即 +1 生命','v',1]]},
{id:'regen',n:'護盾再生',d:'定時自動恢復護盾',c:600,ups:[['再生更快','v',.5]]},
{id:'rage',n:'狂暴',d:'生命越少攻擊越高',c:700,ups:[['加成提升','v',.5]]},
{id:'rapid',n:'連射',d:'射速 +20%',c:500,ups:[['射速再提升','v',.5]]},
{id:'heavy',n:'重擊',d:'武器傷害 +25%',c:500,ups:[['傷害再提升','v',.5]]},
{id:'pier',n:'穿透彈頭',d:'子彈多穿透 1 隻敵人',c:450,ups:[['再 +1 穿透','v',1]]},
{id:'chrono',n:'時間領主',d:'定時自動減緩時間',c:900,ups:[['觸發更頻繁','v',.5]]},
{id:'dron',n:'僚機召喚',d:'開局多 1 台輔助機',c:700,ups:[['立即 +1 輔助機','v',1]]},
{id:'bmb',n:'炸彈專家',d:'開局多 2 顆炸彈，炸彈更強',c:400,ups:[['炸彈更強','v',.5]]}];
function sv(id){return RS[id]?RS[id].v:0}
function initSkills(){RS={};SV.sk.e.forEach(id=>{RS[id]={dm:1,cd:1,n:0,bn:0,r:1,v:1,t:1.2,cnt:0,a:0,u:[0,0,0]}});if(RS.hull)P.lives+=1;if(RS.dron)P.dr=Math.min(4,P.dr+1);if(RS.bmb)P.bm=Math.min(5,P.bm+2)}

  else if(k==='home'){const w=[-9,-2,-17,6,-9,8];poly(w,c);poly(mir(w),c);cc(0,0,10,c);cc(0,1,6.5,'#fff');const a=Math.atan2(P.y-e.y,P.x-e.x);cc(Math.cos(a)*2.8,1+Math.sin(a)*2.8,3,'#1a1a2e')}
  else if(k==='spin'){ctx.rotate(e.sa||time*2);for(let i=0;i<4;i++){poly([-3,0,3,0,2,-17,-2,-17],c);ctx.rotate(1.5708)}cc(0,0,7,dk);cc(0,0,3.5,lt)}
  else if(k==='rock'){ctx.rotate(e.rot);const rk=[];for(let i=0;i<9;i++){const a=i/9*6.283,r=11+((i*7)%4)*1.6;rk.push(Math.cos(a)*r,Math.sin(a)*r)}poly(rk,hit?'#fff':'#8a8fa8');poly(rk.map(v=>v*.6),'rgba(0,0,0,.25)');cc(-4,-3,2.5,'rgba(0,0,0,.35)');cc(4,4,2,'rgba(0,0,0,.35)')}
  else if(k==='boss'){poly([0,26,-22,10,-44,14,-38,-8,-18,-22,18,-22,38,-8,44,14,22,10],c);poly([0,18,-14,6,-14,-12,14,-12,14,6],dk);ctx.fillStyle=dk;ctx.fillRect(-35,6,7,16);ctx.fillRect(28,6,7,16);cc(-26,-4,2,'#fff');cc(26,-4,2,'#fff');cc(0,-2,9,lt);cc(0,-2,5+Math.sin(time*6)*1.5,c)}
  ctx.restore()}
function ship(x,y,col,dir,s){
  ctx.beginPath();ctx.moveTo(x,y-18*dir*s);ctx.lineTo(x+14*s,y+14*dir*s);ctx.lineTo(x,y+7*dir*s);ctx.lineTo(x-14*s,y+14*dir*s);ctx.closePath();ctx.fillStyle=col;ctx.fill();
}
function draw(dt){
  ctx.save();if(shk>0){shk=Math.max(0,shk-dt);ctx.translate((Math.random()-.5)*shk*40,(Math.random()-.5)*shk*40)}ctx.fillStyle='#0b0d20';ctx.fillRect(-20,-20,W+40,H+40);
  stars.forEach(s=>{s.y+=s.z*30*dt;if(s.y>H){s.y=0;s.x=Math.random()*W}ctx.fillStyle='rgba(241,236,223,'+(s.z/3)+')';ctx.fillRect(s.x,s.y,s.z,s.z*2)});
  if(S==='menu'&&!P){ctx.restore();return}
  // powerups
  pu.forEach(p=>{ctx.shadowColor=ctx.strokeStyle=ctx.fillStyle=PC[p.k];ctx.shadowBlur=12;if(p.k==='b'||p.k==='t'||p.k==='i'){ctx.beginPath();ctx.arc(p.x,p.y,11,0,6.28);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#0b0d20';ctx.font='700 13px sans-serif';ctx.textAlign='center';ctx.fillText({b:'B',t:'T',i:'★'}[p.k],p.x,p.y+5);return}
    if(p.k==='p')ctx.fillRect(p.x-9,p.y-9,18,18);else{ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,10,0,6.28);ctx.stroke()}});
  ctx.shadowBlur=0;
  // enemies
  en.forEach(e=>{
    const col=e.hit>0?'#fff':e.k?KC[e.k]:e.t===0?C.pink:e.t===1?'#b86bff':C.gold;
    ctx.shadowColor=col;ctx.shadowBlur=10;drawE(e);
    
  });
  ctx.shadowBlur=0;
  // bullets
  bul.forEach(b=>{ctx.fillStyle=BC[b.k]?BC[b.k]:b.k==='rocket'?C.gold:b.k==='laser'?'#fff':b.k==='sg'?C.ink:C.teal;ctx.fillRect(b.x-b.w/2,b.y-9,b.w,b.k==='laser'?24:14)});
  ebul.forEach(b=>{ctx.fillStyle='#ff4f4f';ctx.beginPath();ctx.arc(b.x,b.y,6,0,6.28);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,2.5,0,6.28);ctx.fill()});
  // player
  if(P&&(S==='play'||S==='menu')&&!(P.inv>0&&Math.floor(P.inv*12)%2)){
    ctx.shadowColor=C.teal;ctx.shadowBlur=14;drawP();ctx.shadowBlur=0;drawSk();
    
    if(P.shield>0){ctx.strokeStyle=C.teal;ctx.globalAlpha=.7;ctx.lineWidth=2;for(let i=0;i<P.shield;i++){ctx.beginPath();ctx.arc(P.x,P.y,22+i*5,0,6.28);ctx.stroke()}ctx.globalAlpha=1}
  }
  if(S==='play')DR.forEach(d=>{ctx.shadowColor=C.gold;ctx.shadowBlur=8;ctx.fillStyle=C.gold;ctx.beginPath();ctx.arc(d.x,d.y,6,0,6.28);ctx.fill();ctx.fillStyle='#0b0d20';ctx.beginPath();ctx.arc(d.x,d.y,3,0,6.28);ctx.fill();ctx.fillStyle=C.teal;ctx.fillRect(d.x-1.5,d.y-11,3,6);ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(d.x,d.y,9,time*3,time*3+2.2);ctx.stroke();ctx.shadowBlur=0});
  fx.forEach(f=>{ctx.globalAlpha=Math.max(0,f.l/f.m);ctx.fillStyle=f.c;ctx.fillRect(f.x-2,f.y-2,4,4)});ctx.globalAlpha=1;
  FT.forEach(f=>{ctx.globalAlpha=Math.min(1,f.l*2);ctx.fillStyle=f.c;ctx.font='700 14px sans-serif';ctx.textAlign='center';ctx.fillText(f.t,f.x,f.y)});ctx.globalAlpha=1;
  // HUD
  if(P){ctx.fillStyle=C.ink;ctx.font='700 22px sans-serif';ctx.textAlign='left';ctx.fillText(score,16,34);ctx.font='13px sans-serif';ctx.fillStyle=C.gold;ctx.fillText('◎ '+SV.coins+'　技能 '+lk+'/10',16,54);ctx.fillStyle=C.ink;
    ctx.textAlign='right';ctx.font='16px sans-serif';ctx.fillText('生命 '+'▲'.repeat(Math.max(0,P.lives))+'　火力 '+curN()+(P.pw>=pwMax()?' MAX':''),W-16,32);
    ctx.textAlign='center';ctx.font='14px sans-serif';ctx.fillText('第 '+(lvl+1)+' / '+LV.length+' 關',W/2,24);if(cmb>1){ctx.fillStyle=C.gold;ctx.font='700 16px sans-serif';ctx.fillText(cmb+' 連擊'+(cmb>=8?'  ×'+(1+Math.min(4,Math.floor(cmb/8))*.5):''),W/2,76);ctx.fillStyle=C.ink}
    if(P.slow>0){ctx.fillStyle='rgba(90,160,255,.1)';ctx.fillRect(0,0,W,H);ctx.fillStyle=C.ink}
    bb.textContent='💣'+P.bm;bb.style.display=S==='play'?'block':'none';
    const bs=en.find(e=>e.t===3);
    if(bs){ctx.fillStyle='#2a2e55';ctx.fillRect(40,44,W-80,8);ctx.fillStyle=C.pink;ctx.fillRect(40,44,(W-80)*Math.max(0,bs.hp/bs.mhp),8)}
    else if(phase==='fight'){ctx.fillStyle='#2a2e55';ctx.fillRect(40,44,W-80,4);ctx.fillStyle=C.teal;ctx.fillRect(40,44,(W-80)*Math.min(1,lt/LV[lvl].dur),4)}}
  if(banner>0&&P&&S==='play'){ctx.globalAlpha=Math.min(1,banner);ctx.fillStyle=C.ink;ctx.textAlign='center';ctx.font='700 32px sans-serif';
    ctx.fillText(bnTxt?bnTxt:phase==='clear'?'第 '+(lvl+1)+' 關完成':phase==='boss'?'警告：首領出現':'第 '+(lvl+1)+' 關　'+LV[lvl].n,W/2,H/2-80);ctx.globalAlpha=1}
  ctx.restore();if(paused){ctx.fillStyle='rgba(11,13,32,.7)';ctx.fillRect(0,0,W,H);ctx.fillStyle=C.ink;ctx.textAlign='center';ctx.font='700 36px sans-serif';ctx.fillText('已暫停',W/2,H/2);ctx.font='16px sans-serif';ctx.fillText('按 P 或點一下繼續',W/2,H/2+34)}
}

let last=performance.now();
function loop(n){
  const dt=Math.min(.05,(n-last)/1000);last=n;
  if(S==='play'&&!paused&&!picking)update(dt);
  draw(S==='play'&&!paused?dt:0);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function ptr(e){const r=cv.getBoundingClientRect();tx=(e.clientX-r.left)*W/r.width;ty=(e.clientY-r.top)*H/r.height-(e.pointerType==='touch'?60:0);usePtr=true}
cv.addEventListener('pointermove',ptr);
cv.addEventListener('pointerdown',e=>{ptr(e);if(paused)paused=false});
addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT')return;const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=1;
  if(picking&&k.length===1&&'123'.includes(k)){const b=document.querySelectorAll('#pc .card')[+k-1];if(b)b.click()}else if(k==='p'&&S==='play'&&!picking)paused=!paused;
  if(k==='Enter'&&S!=='play'&&authEl.classList.contains('hide'))start(homeLvl);if((k==='b'||k===' ')&&S==='play')useBomb();
  if(k.startsWith('Arrow'))e.preventDefault();
});
addEventListener('keyup',e=>{keys[e.key.length===1?e.key.toLowerCase():e.key]=0});
addEventListener('blur',()=>{if(S==='play')paused=true});
</script>
